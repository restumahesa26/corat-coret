<body class="min-h-screen">

    <!-- Header Baru -->
    <header class="fixed top-0 left-0 w-full p-6 flex justify-center items-center z-10 pointer-events-none">
        <h1 class="text-2xl font-bold text-gray-800">Ruang Corat-Coret</h1>
    </header>

    <!-- Area Teks Full-Screen -->
    <textarea 
        id="scratchpad"
        placeholder="Tuangkan isi kepalamu di sini..."
        aria-label="Area untuk corat-coret teks"
    ></textarea>

    <!-- Kontainer untuk gambar dan emoji -->
    <div id="element-container"></div>

    <!-- Canvas untuk Menggambar -->
    <canvas id="drawingCanvas"></canvas>
    
    <!-- Panel Emoji (tersembunyi secara default) -->
    <div id="emoji-picker" class="hidden"></div>

    <!-- Tombol Upload Gambar -->
    <button id="upload-btn" class="corner-button" aria-label="Upload gambar">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
    </button>
    <input type="file" id="image-input" class="hidden" accept="image/*">
    
    <!-- Tombol Emoji -->
    <button id="emoji-btn" class="corner-button" aria-label="Pilih emoji">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
    </button>

    <!-- Tombol Reset -->
    <button id="reset-btn" class="corner-button" aria-label="Reset halaman">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
    </button>
    
    <!-- Palet Warna dan Penghapus -->
    <div id="color-palette" class="hidden">
        <div id="eraser-btn" aria-label="Penghapus">

        </div>
    </div>
